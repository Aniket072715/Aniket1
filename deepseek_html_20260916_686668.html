<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow · Modern Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    /* ---------- RESET & BASE ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #1e293b;
    }

    /* ---------- APP CONTAINER ---------- */
    .app {
      width: 100%;
      max-width: 560px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ---------- HEADER ---------- */
    .app-header {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      padding: 32px 28px 24px;
    }

    .app-header h1 {
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-header p {
      font-size: 0.9rem;
      opacity: 0.9;
      font-weight: 400;
    }

    /* ---------- STATS ROW ---------- */
    .stats {
      display: flex;
      gap: 14px;
      margin-top: 22px;
    }

    .stat {
      flex: 1;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.85;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
    }

    /* ---------- INPUT AREA ---------- */
    .input-area {
      padding: 24px 28px 12px;
      display: flex;
      gap: 10px;
    }

    .input-area input {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
      background: #f8fafc;
      color: #1e293b;
    }

    .input-area input:focus {
      border-color: #6366f1;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
    }

    .input-area input::placeholder {
      color: #94a3b8;
    }

    .input-area button {
      padding: 14px 22px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 16px -4px rgba(99, 102, 241, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-area button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px -6px rgba(99, 102, 241, 0.5);
    }

    .input-area button:active {
      transform: translateY(0);
    }

    /* ---------- FILTER TABS ---------- */
    .filters {
      display: flex;
      gap: 8px;
      padding: 12px 28px 8px;
    }

    .filter-btn {
      padding: 7px 16px;
      border-radius: 999px;
      border: 1.5px solid #e2e8f0;
      background: white;
      font-size: 0.82rem;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      border-color: #c7d2fe;
      color: #6366f1;
    }

    .filter-btn.active {
      background: #6366f1;
      color: white;
      border-color: #6366f1;
      box-shadow: 0 4px 10px -2px rgba(99, 102, 241, 0.35);
    }

    /* ---------- TASK LIST ---------- */
    .task-list {
      list-style: none;
      padding: 8px 20px 20px;
      max-height: 340px;
      overflow-y: auto;
    }

    .task-list::-webkit-scrollbar {
      width: 6px;
    }

    .task-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .task-list::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      margin-bottom: 8px;
      background: #ffffff;
      border: 1.5px solid #f1f5f9;
      border-radius: 14px;
      transition: all 0.2s ease;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .task-item:hover {
      border-color: #e0e7ff;
      background: #fafbff;
      transform: translateX(4px);
    }

    .task-item.completed {
      opacity: 0.6;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: #94a3b8;
    }

    /* Custom checkbox */
    .checkbox {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border-radius: 7px;
      border: 2px solid #cbd5e1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      background: white;
    }

    .checkbox:hover {
      border-color: #6366f1;
    }

    .checkbox.checked {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-color: #6366f1;
    }

    .checkbox.checked::after {
      content: '✓';
      color: white;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .task-text {
      flex: 1;
      font-size: 0.95rem;
      font-weight: 500;
      color: #1e293b;
      word-break: break-word;
      transition: all 0.2s ease;
    }

    .task-date {
      font-size: 0.7rem;
      color: #94a3b8;
      font-weight: 500;
      white-space: nowrap;
    }

    .delete-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      opacity: 0.4;
      transition: all 0.2s ease;
      padding: 4px 8px;
      border-radius: 8px;
      color: #ef4444;
    }

    .delete-btn:hover {
      opacity: 1;
      background: #fef2f2;
      transform: scale(1.15);
    }

    /* ---------- EMPTY STATE ---------- */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #94a3b8;
      display: none;
    }

    .empty-state.show {
      display: block;
    }

    .empty-state .icon {
      font-size: 3rem;
      margin-bottom: 12px;
      opacity: 0.6;
    }

    .empty-state p {
      font-size: 0.95rem;
      font-weight: 500;
    }

    /* ---------- FOOTER ---------- */
    .app-footer {
      padding: 16px 28px;
      border-top: 1.5px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: #94a3b8;
      font-weight: 500;
    }

    .clear-btn {
      background: transparent;
      border: none;
      color: #ef4444;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 8px;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .clear-btn:hover {
      background: #fef2f2;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 480px) {
      .app-header {
        padding: 24px 20px 20px;
      }
      .app-header h1 {
        font-size: 1.4rem;
      }
      .input-area {
        padding: 18px 20px 10px;
      }
      .filters {
        padding: 10px 20px 6px;
      }
      .task-list {
        padding: 6px 14px 16px;
      }
      .app-footer {
        padding: 14px 20px;
      }
      .stats {
        gap: 10px;
      }
      .stat-value {
        font-size: 1.2rem;
      }
      .task-date {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="app">
    <!-- HEADER -->
    <header class="app-header">
      <h1>✅ TaskFlow</h1>
      <p>Stay organized, get things done.</p>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">Total</div>
          <div class="stat-value" id="totalCount">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Active</div>
          <div class="stat-value" id="activeCount">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Done</div>
          <div class="stat-value" id="doneCount">0</div>
        </div>
      </div>
    </header>

    <!-- INPUT -->
    <div class="input-area">
      <input type="text" id="taskInput" placeholder="What needs to be done?" maxlength="80" autocomplete="off">
      <button id="addBtn" title="Add task">+</button>
    </div>

    <!-- FILTERS -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <!-- TASK LIST -->
    <ul class="task-list" id="taskList"></ul>

    <!-- EMPTY STATE -->
    <div class="empty-state" id="emptyState">
      <div class="icon">📝</div>
      <p>No tasks here. Add one above!</p>
    </div>

    <!-- FOOTER -->
    <footer class="app-footer">
      <span id="footerText">0 tasks</span>
      <button class="clear-btn" id="clearBtn">Clear completed</button>
    </footer>
  </div>

  <script>
    /* ---------- STATE ---------- */
    let tasks = [];
    let currentFilter = 'all';

    /* ---------- DOM ELEMENTS ---------- */
    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const taskList = document.getElementById('taskList');
    const emptyState = document.getElementById('emptyState');
    const totalCount = document.getElementById('totalCount');
    const activeCount = document.getElementById('activeCount');
    const doneCount = document.getElementById('doneCount');
    const footerText = document.getElementById('footerText');
    const clearBtn = document.getElementById('clearBtn');
    const filterBtns = document.querySelectorAll('.filter-btn');

    /* ---------- LOAD FROM LOCALSTORAGE ---------- */
    function loadTasks() {
      try {
        const saved = localStorage.getItem('taskflow-tasks');
        if (saved) {
          tasks = JSON.parse(saved);
        }
      } catch (e) {
        tasks = [];
      }
    }

    /* ---------- SAVE TO LOCALSTORAGE ---------- */
    function saveTasks() {
      try {
        localStorage.setItem('taskflow-tasks', JSON.stringify(tasks));
      } catch (e) {
        console.warn('Could not save tasks');
      }
    }

    /* ---------- FORMAT DATE ---------- */
    function formatDate(timestamp) {
      const d = new Date(timestamp);
      const today = new Date();
      const isToday = d.toDateString() === today.toDateString();
      if (isToday) {
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
      return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }

    /* ---------- RENDER TASKS ---------- */
    function renderTasks() {
      // Filter tasks
      let filtered = tasks;
      if (currentFilter === 'active') {
        filtered = tasks.filter(t => !t.completed);
      } else if (currentFilter === 'completed') {
        filtered = tasks.filter(t => t.completed);
      }

      // Clear list
      taskList.innerHTML = '';

      // Empty state toggle
      if (filtered.length === 0) {
        emptyState.classList.add('show');
      } else {
        emptyState.classList.remove('show');
      }

      // Build task items
      filtered.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.completed ? ' completed' : '');
        li.dataset.id = task.id;

        li.innerHTML = `
          <div class="checkbox ${task.completed ? 'checked' : ''}" data-action="toggle"></div>
          <span class="task-text">${escapeHtml(task.text)}</span>
          <span class="task-date">${formatDate(task.created)}</span>
          <button class="delete-btn" data-action="delete" title="Delete">✕</button>
        `;

        taskList.appendChild(li);
      });

      // Update stats
      const total = tasks.length;
      const done = tasks.filter(t => t.completed).length;
      const active = total - done;

      totalCount.textContent = total;
      activeCount.textContent = active;
      doneCount.textContent = done;
      footerText.textContent = `${active} task${active !== 1 ? 's' : ''} left`;
    }

    /* ---------- ESCAPE HTML ---------- */
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    /* ---------- ADD TASK ---------- */
    function addTask() {
      const text = taskInput.value.trim();
      if (!text) {
        taskInput.focus();
        return;
      }

      const newTask = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        text: text,
        completed: false,
        created: Date.now()
      };

      tasks.unshift(newTask); // new tasks at top
      taskInput.value = '';
      taskInput.focus();
      saveTasks();
      renderTasks();
    }

    /* ---------- TOGGLE TASK ---------- */
    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        saveTasks();
        renderTasks();
      }
    }

    /* ---------- DELETE TASK ---------- */
    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderTasks();
    }

    /* ---------- CLEAR COMPLETED ---------- */
    function clearCompleted() {
      tasks = tasks.filter(t => !t.completed);
      saveTasks();
      renderTasks();
    }

    /* ---------- EVENT LISTENERS ---------- */

    // Add task
    addBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask();
    });

    // Task list delegation (toggle / delete)
    taskList.addEventListener('click', (e) => {
      const item = e.target.closest('.task-item');
      if (!item) return;

      const id = item.dataset.id;
      const action = e.target.dataset.action;

      if (action === 'toggle') toggleTask(id);
      if (action === 'delete') deleteTask(id);
    });

    // Filter buttons
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderTasks();
      });
    });

    // Clear completed
    clearBtn.addEventListener('click', clearCompleted);

    /* ---------- INIT ---------- */
    loadTasks();
    renderTasks();
  </script>
</body>
</html>
